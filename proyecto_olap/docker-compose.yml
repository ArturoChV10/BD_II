services:
  # Base de datos fuente (PostgreSQL, también puede ser MongoDB)
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: restaurantes
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Neo4j
  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/test1234
    ports:
      - "7474:7474"  # interfaz web
      - "7687:7687"  # Bolt

  # Elasticsearch
  elasticsearch:
    image: elasticsearch:8.10.2
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
    ports:
      - "9200:9200"

  # Superset (visualización)
  superset:
    image: apache/superset:4.0.2
    environment:
      SUPERSET_SECRET_KEY: 'secret_key'
    ports:
      - "8088:8088"
    command: >
      sh -c "superset fab create-admin &&
             superset init &&
             superset run -p 8088 --with-threads --reload --debugger"
    # usuario por defecto: admin / admin

  # Spark Master + Worker (spark standalone)
  spark-master:
    image: apache/spark:3.5.3
    ports:
      - "8081:8080"
      - "7077:7077"
    command: >
      /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
  spark-worker:
    image: apache/spark:3.5.3
    command: >
      /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077

  # Hive (requiere Hadoop, usamos imagen de apache/hive standalone)
  hive-server:
    image: apache/hive:4.0.0
    ports:
      - "10000:10000"  # puerto JDBC/Thrift
    environment:
      - SERVICE_NAME=hiveserver2
    depends_on:
      - postgres  # metastore usa postgres
    volumes:
      - hive_data:/opt/hive/data

  # Airflow (con CeleryExecutor opcional, usamos LocalExecutor para simplificar)
  airflow:
    image: apache/airflow:2.8.1
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://admin:admin123@postgres/airflow
    ports:
      - "8080:8080"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
    command: >
      sh -c "airflow db init &&
             airflow users create --username admin --password admin --firstname Admin --lastname User --role Admin --email admin@example.com &&
             airflow webserver & airflow scheduler"
    depends_on:
      - postgres

volumes:
  postgres_data:
  hive_data: